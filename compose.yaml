services:
  novelpia-downloader:
    build: .
    image: novelpia-downloader-web:local
    container_name: novelpia-downloader
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8797}:8080"
    environment:
      WEB_USERNAME: "${WEB_USERNAME:-admin}"
      WEB_PASSWORD: "${WEB_PASSWORD:?Run ./docker/setup.sh first}"
      TZ: "${TZ:-Asia/Seoul}"
    volumes:
      - ./data:/data
    shm_size: 256m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
