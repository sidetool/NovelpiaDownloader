user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    # Private image transport: Mono reads HTTP on loopback; OpenSSL negotiates
    # and verifies the CDN's HTTPS connection, including TLS 1.3.
    server {
        listen 127.0.0.1:8091;
        access_log off;
        location = /healthz {
            default_type text/plain;
            return 200 'ok\n';
        }
        location / {
            limit_except GET { deny all; }
            resolver 127.0.0.11 ipv6=off valid=60s;
            resolver_timeout 5s;
            set $image_origin images.novelpia.com;
            proxy_pass https://$image_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host images.novelpia.com;
            proxy_set_header Connection $http_connection;
            proxy_ssl_server_name on;
            proxy_ssl_name images.novelpia.com;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_redirect off;
        }
    }
    server {
        listen 8080;
        root /var/www/novelpia;
        auth_basic "NovelpiaDownloader";
        auth_basic_user_file /run/novelpia/htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        location = /healthz {
            auth_basic off;
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control no-cache;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8090;
            proxy_read_timeout 180s;
            proxy_buffering off;
            add_header Cache-Control no-store;
        }
        location /files/ {
            alias /data/downloads/;
            autoindex on;
            autoindex_format json;
            charset utf-8;
            disable_symlinks on;
            add_header Cache-Control no-store;
            add_header Content-Disposition attachment;
        }
    }
}
